<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Audio Transcription</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        box-sizing: border-box;
        width: min(100%, 560px);
        padding: 32px;
        border: 1px solid #e0e5ef;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 12px 36px #17203312;
      }

      h1 {
        margin-top: 0;
        font-size: 1.8rem;
      }

      p {
        line-height: 1.55;
      }

      .hint {
        color: #536078;
        font-size: 0.9rem;
      }

      label {
        display: block;
        margin: 24px 0 8px;
        font-weight: 650;
      }

      input,
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 48px;
        font: inherit;
      }

      input {
        padding: 10px;
        border: 1px solid #aeb8ca;
        border-radius: 8px;
        background: #fff;
      }

      button {
        margin-top: 16px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: #3156c9;
        font-weight: 650;
        cursor: pointer;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #status {
        min-height: 1.5em;
        margin-bottom: 0;
      }

      #result {
        margin-top: 20px;
        padding: 16px;
        border-radius: 8px;
        background: #f2f5fb;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      #result:empty {
        display: none;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 480px) {
        body {
          padding: 14px;
        }

        main {
          padding: 24px 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Audio transcription</h1>
      <p>Choose an audio file to turn its speech into text.</p>
      <p class="hint">Files up to 25 MB. Your audio is sent to Google Gemini for transcription.</p>

      <form id="transcription-form">
        <label for="audio">Audio file</label>
        <input
          id="audio"
          name="audio"
          type="file"
          accept="audio/*,.mp3,.m4a,.mp4,.wav,.webm,.ogg,.flac"
          required
        >
        <button id="submit" type="submit">Transcribe audio</button>
      </form>

      <p id="status" role="status" aria-live="polite"></p>
      <section id="transcript-section" aria-labelledby="transcript-heading" hidden>
        <h2 id="transcript-heading">Transcript</h2>
        <div id="result"></div>
      </section>
    </main>

    <script src="/app.js" defer></script>
  </body>
</html>
